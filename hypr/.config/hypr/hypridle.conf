general {
    lock_cmd = pidof hyprlock || hyprlock       # prevent multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before laptop lids close
    after_sleep_cmd = hyprctl dispatch dpms on  # wake up display on resume
}

# 1. THE WARNING (9 mins)
listener {
    timeout = 540
    on-timeout = notify-send "you are idle, right? if yes, your screen will turn off in 1 minute"
}

# 2. THE LOCK (9.5 mins)
# We lock 30 seconds BEFORE the screen goes black to ensure 
# hyprlock is ready and "owning" the screen buffer.
listener {
    timeout = 570
    on-timeout = loginctl lock-session
}

# 3. THE SCREEN OFF (10 mins)
# This is exactly 1 minute after your notification fired.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. THE SUSPEND (30 mins)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
