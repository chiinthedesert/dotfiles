# hyprlock.conf
general {
    no_fade_in = true
    grace = 0
    disable_loading = true
}

background {
    monitor =
    color = rgba(25, 20, 20, 1.0)
    # Reduced blur_passes for stability on integrated AMD graphics
    blur_passes = 1 
}

input-field {
    monitor =
    size = 25%, 5%
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(33ccff)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <b> password... </b>
    fail_text = <b> you mistyped </b>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
