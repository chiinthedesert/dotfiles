# fonts
font_family JetBrainsMono NFM
bold_font JetBrainsMono NFM Bold
italic_font JetBrainsMono NFM Italic
bold_italic_font JetBrainsMono NFM Bold Italic
font_size 13.0
symbol_map U+1F300-U+1F6FF emoji
disable_ligatures cursor

# shell
shell_integration no-cursor

# window
window_margin_width 0
window_padding_width 0 2 0 2
placement_strategy center
confirm_os_window_close 0
window_border_width 1pt
draw_minimal_borders yes
enabled_layouts splits:equalize_on_window_close=true

map alt+space>v launch --location=vsplit --cwd=current
map alt+space>s launch --location=hsplit --cwd=current

map alt+space>h neighboring_window left
map alt+space>j neighboring_window down
map alt+space>k neighboring_window up
map alt+space>l neighboring_window right

# tabs
tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style separator
tab_bar_align center
tab_bar_min_tabs 1
tab_separator " "
tab_title_template "{index}:{title}"
active_tab_title_template "[{index}:{title}]"
active_tab_font_style bold

# appearance
background_opacity 0.89
dynamic_background_opacity yes

# keybindings
map alt+x close_tab
map alt+1 kitten goto_or_create_tab.py 1
map alt+2 kitten goto_or_create_tab.py 2
map alt+3 kitten goto_or_create_tab.py 3
map alt+4 kitten goto_or_create_tab.py 4
map alt+5 kitten goto_or_create_tab.py 5
map alt+6 kitten goto_or_create_tab.py 6
map alt+7 kitten goto_or_create_tab.py 7
map alt+8 kitten goto_or_create_tab.py 8
map alt+9 kitten goto_or_create_tab.py 9
map alt+0 kitten goto_or_create_tab.py 10

# theme
include themes/forestbones.conf
