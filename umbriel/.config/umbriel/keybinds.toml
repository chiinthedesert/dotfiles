# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]
"Mod+M" = { action = "submap move", repeat = false }
"submap[move],Escape" = "submap reset"

# Applications and session
"Mod+Return" = { action = "spawn foot", repeat = false }
"Mod+A" = "spawn noctalia msg panel-toggle launcher"
"Mod+X" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Screenshots (Noctalia)
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Shift+Print" = { action = "spawn noctalia msg screenshot-region --annotate", repeat = false }
"Mod+Shift+Print" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

"submap[move],H" = "column-move-left"
"submap[move],J" = "window-move-down"
"submap[move],K" = "window-move-up"
"submap[move],L" = "column-move-right"
"submap[move],Left" = "column-move-left"
"submap[move],Down" = "window-move-down"
"submap[move],Up" = "window-move-up"
"submap[move],Right" = "column-move-right"

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"

"submap[move],1" = "column-move-to-workspace 1"
"submap[move],2" = "column-move-to-workspace 2"
"submap[move],3" = "column-move-to-workspace 3"
"submap[move],4" = "column-move-to-workspace 4"
"submap[move],5" = "column-move-to-workspace 5"
"submap[move],6" = "column-move-to-workspace 6"
"submap[move],7" = "column-move-to-workspace 7"
"submap[move],8" = "column-move-to-workspace 8"
"submap[move],9" = "column-move-to-workspace 9"

"Mod+Tab" = "output-focus-next"
"submap[move],Shift+H" = "column-move-to-output-left"
"submap[move],Shift+L" = "column-move-to-output-right"
"submap[move],Shift+Left" = "column-move-to-output-left"
"submap[move],Shift+Right" = "column-move-to-output-right"
"submap[move],Ctrl+H" = "workspace-move-to-output-left"
"submap[move],Ctrl+L" = "workspace-move-to-output-right"
"submap[move],Ctrl+Left" = "workspace-move-to-output-left"
"submap[move],Ctrl+Right" = "workspace-move-to-output-right"

"submap[move],Comma" = "window-consume-or-expel-left"
"submap[move],Period" = "window-consume-or-expel-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+N" = "column-focus-tab-next"
"Mod+P" = "column-focus-tab-previous"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+Shift+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }

"submap[move],U" = "window-cycle-primary-extent"
"submap[move],O" = "window-cycle-primary-extent-back"
"submap[move],Minus" = "window-modify-primary-extent -0.05"
"submap[move],Equal" = "window-modify-primary-extent +0.05"
"submap[move],Ctrl+Minus" = "window-modify-secondary-extent -0.05"
"submap[move],Ctrl+Equal" = "window-modify-secondary-extent +0.05"

"Mod+O" = { action = "overview-toggle", repeat = false }

